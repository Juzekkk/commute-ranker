# Szablon ustawień. Skopiuj ten plik do config.toml i uzupełnij:
#   Windows:      copy config.example.toml config.toml
#   macOS/Linux:  cp config.example.toml config.toml
# config.toml jest w .gitignore, bo zawiera Twój klucz Google API.

# WYSZUKIWANIE
# Ustaw filtry na otodom.pl w przeglądarce (wynajem/sprzedaż, cena, metraż,
# pokoje, dzielnice), a potem wklej tu adres strony z wynikami.
# Każde wyszukiwanie ma nazwę (klucz) i adres. Adresów może być kilka i mogą pochodzić
# z różnych portali (otodom.pl, nieruchomosci-online.pl, olx.pl). Portale wyszukują
# naraz tylko mieszkania albo tylko domy, więc wklej osobny adres dla każdego rodzaju.
# Oferty ze wszystkich wyszukiwań trafiają do jednego rankingu (duplikaty odpadają).
# Wszystkie naraz:  python dojazdy.py
# Wybrane:          python dojazdy.py otodom-m olx-m   (reszta zostaje z poprzedniego pobrania)
# Nazwy są dowolne (litery, cyfry, myślnik). Im węższe wyszukiwanie, tym szybciej działa.
[wyszukiwania]
otodom-m = "https://www.otodom.pl/pl/wyniki/wynajem/mieszkanie/mazowieckie/warszawa/warszawa/warszawa?priceMax=5000&roomsNumber=%5BTWO%2CTHREE%5D"
otodom-d = "https://www.otodom.pl/pl/wyniki/wynajem/dom/mazowieckie/warszawa/warszawa/warszawa?priceMax=7000"
# inne portale (odkomentuj, żeby włączyć):
# nieruchomosci-m = "https://warszawa.nieruchomosci-online.pl/mieszkania,wynajem/"
# olx-m = "https://www.olx.pl/nieruchomosci/mieszkania/wynajem/warszawa/"

# POBIERANIE
# Gdy portal zwraca błędy (np. 429 "too many requests"), skrypt robi kilka ponowień,
# a potem przestaje pytać ten portal i idzie dalej z tym, co już pobrał.
# limit_minut_na_portal: najdłuższy czas na jeden portal w jednym uruchomieniu
#   (domyślnie 20). Po jego przekroczeniu skrypt kończy pobieranie z portalu.
[pobieranie]
limit_minut_na_portal = 20

# FILTRY
# Oferty bez ceny skrypt pomija zawsze.
# max_rok_budowy: pomiń oferty z rokiem budowy (a inwestycje z terminem oddania)
#   późniejszym niż ten rok. Usuń linię, jeśli nie chcesz tego filtra.
[filtry]
max_rok_budowy = 2027

# GOOGLE MAPS (Routes API)
# Klucz tworzysz w Google Cloud Console (console.cloud.google.com): nowy projekt,
# podpięte konto rozliczeniowe, włączone "Routes API", potem
# "Dane logowania" -> "Utwórz dane logowania" -> "Klucz interfejsu API".
[google]
api_key = ""

# TWOJE MIEJSCA (przykładowe, podmień na swoje)
# wspolrzedne: w Google Maps kliknij prawym przyciskiem w miejsce, potem kliknij
#   w liczby na górze menu. Skopiują się dokładnie w takim formacie.
# razy_w_tygodniu: ile razy w tygodniu tam jeździsz. To jest waga: ranking
#   sumuje czas w drodze w ciągu tygodnia (tam i z powrotem).
# max_minut (opcjonalne): odrzuć oferty, z których dojazd w jedną stronę
#   trwa dłużej. Usuń tę linię, jeśli nie chcesz limitu.
# Czasy liczone są dla przyjazdu we wtorek o 9:00. Dla wizyt wieczornych
#   i weekendowych to przybliżenie.

[[miejsca]]
nazwa = "Praca"
wspolrzedne = "52.2302, 20.9836"
razy_w_tygodniu = 5
max_minut = 40

[[miejsca]]
nazwa = "Rodzice"
wspolrzedne = "52.1311, 21.0657"
razy_w_tygodniu = 1

[[miejsca]]
nazwa = "Siłownia"
wspolrzedne = "52.2196, 21.0147"
razy_w_tygodniu = 2
